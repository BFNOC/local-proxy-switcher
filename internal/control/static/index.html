<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本地代理切换器</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101314;
      color: #eef2f1;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101314;
    }
    main {
      width: min(760px, calc(100vw - 32px));
      border: 1px solid #2f3937;
      border-radius: 8px;
      padding: 24px;
      background: #171c1b;
    }
    h1 {
      margin: 0 0 18px;
      font-size: 24px;
      font-weight: 650;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .cell {
      border: 1px solid #2f3937;
      border-radius: 6px;
      padding: 12px;
      min-height: 58px;
    }
    .label {
      color: #94a29e;
      font-size: 12px;
      margin-bottom: 5px;
    }
    .value {
      overflow-wrap: anywhere;
      font-size: 15px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }
    button {
      border: 1px solid #53625e;
      background: #20302c;
      color: #eef2f1;
      border-radius: 6px;
      padding: 9px 12px;
      cursor: pointer;
    }
    button:hover { background: #29413a; }
    button:disabled {
      opacity: 0.55;
      cursor: wait;
    }
    button.warn {
      border-color: #f59e0b;
      background: #34260c;
    }
    button.warn:hover { background: #44340f; }
    input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #53625e;
      background: #0f1212;
      color: #eef2f1;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .tcping-panel {
      margin-top: 4px;
      margin-bottom: 14px;
    }
    .tcping-summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin: 10px 0;
    }
    .tcping-probes {
      display: grid;
      gap: 6px;
      margin-top: 10px;
    }
    .probe {
      display: grid;
      grid-template-columns: 56px minmax(80px, 1fr) minmax(0, 2fr);
      gap: 8px;
      align-items: center;
      border-top: 1px solid #2f3937;
      padding-top: 6px;
      font-size: 13px;
    }
    .latency-good { color: #4ade80; }
    .latency-warn { color: #facc15; }
    .latency-bad { color: #f87171; }
    .error { color: #ffb4a8; }
    @media (max-width: 620px) {
      .grid { grid-template-columns: 1fr; }
      .tcping-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .probe { grid-template-columns: 44px minmax(70px, 1fr); }
      .probe .value:last-child { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
<main>
  <h1>本地代理切换器</h1>
  <div class="grid">
    <div class="cell"><div class="label">当前上游</div><div class="value" id="current">-</div></div>
    <div class="cell"><div class="label">剩余时间</div><div class="value" id="expires">-</div></div>
    <div class="cell"><div class="label">线路</div><div class="value" id="net">-</div></div>
    <div class="cell"><div class="label">活跃连接</div><div class="value" id="active">-</div></div>
  </div>
  <div class="actions">
    <button id="switch" onclick="switchProxy(false, false)">切换</button>
    <button id="switch-interrupt" onclick="switchProxy(true, false)">切换并中断旧连接</button>
    <button id="clear" onclick="clearProxy()">清空</button>
    <button onclick="refresh()">刷新</button>
  </div>
  <input id="manual" placeholder="http://1.2.3.4:8080 或 socks5://user:pass@1.2.3.4:1080">
  <div class="actions">
    <button id="manual-lock" onclick="lockManual(false)">手动锁定</button>
    <button id="manual-lock-interrupt" onclick="lockManual(true)">手动锁定并中断</button>
  </div>
  <div class="cell tcping-panel">
    <div class="label">HTTPS 目标</div>
    <input id="tcping-url" inputmode="url" autocomplete="url" placeholder="https://example.com">
    <div class="actions">
      <button id="tcping-button" onclick="tcping()">TCPing</button>
      <button id="tcping-switch" onclick="switchAndRetest(false)">切换后复测</button>
      <button id="tcping-switch-interrupt" onclick="switchAndRetest(true)">切换中断后复测</button>
    </div>
    <div class="grid tcping-summary">
      <div><div class="label">目标</div><div class="value" id="tcping-target">-</div></div>
      <div><div class="label">平均</div><div class="value" id="tcping-avg">-</div></div>
      <div><div class="label">范围</div><div class="value" id="tcping-range">-</div></div>
      <div><div class="label">丢包</div><div class="value" id="tcping-loss">-</div></div>
    </div>
    <div class="label">经由</div>
    <div class="value" id="tcping-via">-</div>
    <div class="tcping-probes" id="tcping-probes"></div>
  </div>
  <div class="cell"><div class="label">最近结果</div><div class="value" id="result">-</div></div>
</main>
<script>
let lastTCPing = null;
let currentUpstreamURL = '';
let tcpingUpstreamURL = '';
let switchBusy = false;
let tcpingBusy = false;
let statusFetchFailed = false;

async function refresh(updateResult = true) {
  try {
    const res = await fetch('/status');
    const data = await res.json();
    const recovered = statusFetchFailed;
    statusFetchFailed = false;
    render(data, updateResult || recovered);
  } catch (err) {
    statusFetchFailed = true;
    show('error', err.message);
  }
}
function render(data, updateResult = true) {
  const nextUpstreamURL = data.current ? (data.current.url || '') : '';
  const upstreamChanged = nextUpstreamURL !== currentUpstreamURL;
  currentUpstreamURL = nextUpstreamURL;
  document.getElementById('current').textContent = data.current ? data.current.url : '无';
  document.getElementById('expires').textContent = data.current ? (data.current.expires_in || '-') : '-';
  document.getElementById('net').textContent = data.current ? (data.current.net || '-') : '-';
  document.getElementById('active').textContent = data.active_connections;
  if (lastTCPing && upstreamChanged && tcpingUpstreamURL !== currentUpstreamURL) {
    clearTCPingResult('上游已切换，请重新 TCPing');
  }
  if (updateResult || data.last_error || upstreamChanged) {
    show(data.last_error ? 'error' : '', data.last_error || data.last_switch || '成功');
  }
}
async function post(path, body) {
  try {
    const res = await fetch(path, {
      method: 'POST',
      headers: body ? {'Content-Type': 'application/json'} : {},
      body: body ? JSON.stringify(body) : undefined
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    render(data);
    return data;
  } catch (err) {
    show('error', err.message);
    return null;
  }
}
function lockManual(interrupt) {
  if (mutationBusy()) return null;
  const url = document.getElementById('manual').value.trim();
  if (!url) return show('error', '缺少手动上游地址');
  return runMutation('/lock' + (interrupt ? '?interrupt=true' : ''), {url});
}
function clearProxy() {
  return runMutation('/clear');
}
async function switchProxy(interrupt, retest) {
  const data = await runMutation('/switch' + (interrupt ? '?interrupt=true' : ''));
  if (data && retest) await tcping();
  return data;
}
async function runMutation(path, body) {
  if (mutationBusy()) return null;
  setSwitchBusy(true);
  try {
    return await post(path, body);
  } finally {
    setSwitchBusy(false);
  }
}
async function tcping() {
  if (switchBusy || tcpingBusy) return null;
  const url = document.getElementById('tcping-url').value.trim();
  if (!url) {
    showTCPingError('缺少 HTTPS 域名');
    return null;
  }
  setTCPingBusy(true);
  try {
    const res = await fetch('/tcping', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({url})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    renderTCPing(data);
    return data;
  } catch (err) {
    showTCPingError(err.message);
    return null;
  } finally {
    setTCPingBusy(false);
  }
}
async function switchAndRetest(interrupt) {
  return switchProxy(interrupt, true);
}
function renderTCPing(data) {
  lastTCPing = data;
  tcpingUpstreamURL = data.via || '';
  if (currentUpstreamURL && tcpingUpstreamURL && tcpingUpstreamURL !== currentUpstreamURL) {
    clearTCPingResult('上游已切换，请重新 TCPing');
    show('error', 'TCPing 结果已过期');
    return;
  }
  const hasLatency = data.probes.some((probe) => probe.ok);
  const avgClass = latencyClass(data.avg_ms, data.loss);
  document.getElementById('tcping-target').textContent = data.target || '-';
  document.getElementById('tcping-via').textContent = data.via || '-';
  setLatency('tcping-avg', hasLatency ? (data.avg_ms || 0) + ' ms' : '-', avgClass);
  setLatency('tcping-range', hasLatency ? (data.min_ms || 0) + '-' + (data.max_ms || 0) + ' ms' : '-', avgClass);
  setLatency('tcping-loss', data.loss + '/' + data.count, data.loss ? 'latency-bad' : 'latency-good');
  document.getElementById('tcping-probes').innerHTML = data.probes.map((probe) => {
    const cls = probe.ok ? latencyClass(probe.latency_ms, 0) : 'latency-bad';
    const latency = probe.ok ? probe.latency_ms + ' ms' : 'timeout';
    const status = probe.ok ? '成功' : (probe.error || '失败');
    return '<div class="probe">' +
      '<div class="label">#' + probe.seq + '</div>' +
      '<div class="value ' + cls + '">' + latency + '</div>' +
      '<div class="value">' + escapeHTML(status) + '</div>' +
      '</div>';
  }).join('');
  const warn = data.loss > 0 || (data.avg_ms || 0) > 300;
  document.getElementById('tcping-switch').classList.toggle('warn', warn);
  document.getElementById('tcping-switch-interrupt').classList.toggle('warn', warn);
  show(data.success ? '' : 'error', data.success ? 'TCPing 成功' : (data.error || 'TCPing 失败'));
}
function clearTCPingResult(viaText) {
  lastTCPing = null;
  tcpingUpstreamURL = '';
  document.getElementById('tcping-target').textContent = '-';
  document.getElementById('tcping-via').textContent = viaText || '-';
  setLatency('tcping-avg', '-', '');
  setLatency('tcping-range', '-', '');
  setLatency('tcping-loss', '-', '');
  document.getElementById('tcping-probes').innerHTML = '';
  document.getElementById('tcping-switch').classList.remove('warn');
  document.getElementById('tcping-switch-interrupt').classList.remove('warn');
}
function showTCPingError(text) {
  clearTCPingResult('-');
  setLatency('tcping-avg', '-', 'latency-bad');
  setLatency('tcping-range', '-', 'latency-bad');
  setLatency('tcping-loss', '-', 'latency-bad');
  show('error', text);
}
function setLatency(id, text, cls) {
  const el = document.getElementById(id);
  el.className = 'value ' + cls;
  el.textContent = text;
}
function latencyClass(ms, loss) {
  if (loss || ms === undefined || ms === null || ms > 300) return 'latency-bad';
  if (ms >= 100) return 'latency-warn';
  return 'latency-good';
}
function mutationBusy() {
  return switchBusy;
}
function setSwitchBusy(busy) {
  switchBusy = busy;
  updateBusyState();
}
function setTCPingBusy(busy) {
  tcpingBusy = busy;
  updateBusyState();
}
function updateBusyState() {
  const mutationLocked = mutationBusy();
  const tcpingLocked = switchBusy || tcpingBusy;
  document.getElementById('switch').disabled = mutationLocked;
  document.getElementById('switch').textContent = switchBusy ? '切换中...' : '切换';
  document.getElementById('switch-interrupt').disabled = mutationLocked;
  document.getElementById('switch-interrupt').textContent = switchBusy ? '切换中...' : '切换并中断旧连接';
  document.getElementById('clear').disabled = mutationLocked;
  document.getElementById('manual').disabled = mutationLocked;
  document.getElementById('manual-lock').disabled = mutationLocked;
  document.getElementById('manual-lock-interrupt').disabled = mutationLocked;
  document.getElementById('tcping-button').disabled = tcpingLocked;
  document.getElementById('tcping-button').textContent = tcpingBusy ? '测试中...' : 'TCPing';
  document.getElementById('tcping-switch').disabled = tcpingLocked;
  document.getElementById('tcping-switch-interrupt').disabled = tcpingLocked;
}
function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[ch]));
}
function show(cls, text) {
  const el = document.getElementById('result');
  el.className = 'value ' + cls;
  el.textContent = text || '-';
}
refresh();
setInterval(() => refresh(false), 3000);
</script>
</body>
</html>
